# ============================================================
# SOYSMonthlyCard 语言包（简体中文）
# 由主插件 SOYSHTTPOverMC 的 I18n 机制加载/识别：
#   SOYSMonthlyCard.onEnable → I18n.registerLanguageSource(...)
# key 统一 soysmonthlycard. 前缀（插件名小写，避免与其他插件键冲突）
